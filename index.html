<!DOCTYPE html>
<html lang="en" data-theme="dark" data-default-theme="dark" data-palette="lunar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arka Patra — Cybersecurity &amp; Innovation</title>
<meta name="description" content="The portfolio of Arka Patra — a cybersecurity student and security-focused developer from West Bengal. Step into the lunar interface.">
<meta property="og:title" content="Arka Patra — Cybersecurity &amp; Innovation">
<meta property="og:description" content="Welcome to my world of cybersecurity and innovation. Pick a screen and step inside.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#151515" id="metaTheme">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&amp;family=Source+Serif+4:ital,opsz,wght@1,8..60,300;1,8..60,400&amp;family=Courier+Prime:wght@400;700&amp;display=swap" rel="stylesheet">
<script>
document.documentElement.classList.add('js');
(function () {
  try {
    var theme = localStorage.getItem('arka-theme');
    if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    var palette = localStorage.getItem('arka-palette');
    if (palette) document.documentElement.setAttribute('data-palette', palette);
  } catch (error) {}
})();
</script>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to portfolio entry</a>

<div class="entry-toolbar">
  <div class="theme-toggle" role="group" aria-label="Colour theme">
    <button class="theme-toggle__btn" type="button" data-set-theme="light" aria-pressed="false">Light</button>
    <button class="theme-toggle__btn" type="button" data-set-theme="dark" aria-pressed="true">Dark</button>
  </div>
</div>

<main id="main" class="slide-main">
  <section class="slide slide--cover" aria-labelledby="entryTitle">
    <div class="frame entry-grid">
      <div class="entry-copy" data-reveal>
        <span class="kicker"><i class="kicker__square" aria-hidden="true"></i>Open to internships / 2026</span>
        <h1 class="display display--entry entry-title" id="entryTitle">Welcome to<br>my world of<br><em>Cybersecurity</em><br><em>&amp; Innovation.</em></h1>
        <p class="entry-lead">Arka Patra — Cybersecurity Student, West Bengal.</p>
        <a class="btn btn--solid entry-cta" href="dashboard.html">
          <span class="desktop-label">Click the laptop to enter</span>
          <span class="mobile-label">Tap to enter</span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </div>

      <div class="entry-art" data-reveal style="--delay:120ms">
        <div class="orbit">
          <span class="orbit__ring" aria-hidden="true"></span>
          <span class="orbit__disc" aria-hidden="true"></span>
          <span class="orbit__dot" aria-hidden="true"></span>

          <a class="laptop" href="dashboard.html" data-device="laptop" aria-label="Open the portfolio — laptop view">
            <span class="laptop__screen">
              <img class="laptop__preview" src="assets/screen-home-desktop.webp" alt="Home page shown in the laptop view" width="702" height="450" decoding="async">
            </span>
            <span class="laptop__base" aria-hidden="true"></span>
          </a>

          <a class="phone" href="dashboard.html" data-device="phone" aria-label="Open the portfolio — mobile view">
            <img class="phone__preview" src="assets/screen-home-phone.webp" alt="Home page shown in the mobile view" width="260" height="500" decoding="async">
          </a>
        </div>
        <p class="entry-caption mono" id="deviceCaption"><span>Laptop — click to enter</span><br><span>Phone — mobile only</span></p>
      </div>
    </div>
  </section>
</main>
<script src="assets/site.js"></script>
</body>
</html>
